<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chord Lab - Visual Analysis</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: white; touch-action: manipulation; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        button { padding: 15px 5px; border: none; border-radius: 5px; background: #333; color: white; font-size: 1.1rem; min-height: 60px; outline: none; }
        button.selected { background: #007bff; font-weight: bold; }
        button.bass { border: 3px solid #ff4757; box-sizing: border-box; }
        #display { background: #000; padding: 15px; border-radius: 10px; min-height: 200px; margin-bottom: 20px; border: 1px solid #444; }
        .chord-list { max-height: 300px; overflow-y: auto; }
        .chord-item { margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .chord-name { font-size: 1.6rem; font-weight: bold; color: #00d1b2; margin-bottom: 8px; }
        
        /* 視覚的なインターバル表示 */
        .viz-bar { display: flex; width: 100%; height: 24px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 5px; border: 1px solid #444; }
        .viz-cell { flex: 1; text-align: center; font-size: 0.7rem; line-height: 24px; border-right: 1px solid #333; color: #555; position: relative; }
        .viz-cell.active { background: #ffa502; color: #000; font-weight: bold; }
        .viz-cell.root { background: #ff4757; color: #fff; }
        
        .label { font-size: 0.75rem; color: #888; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div id="display">
        <div class="label">INTERPRETATIONS (Visual Root-Relative Structure):</div>
        <div id="chord-out" class="chord-list">SELECT NOTES</div>
    </div>
    <div class="grid" id="pad"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <script>
        const rawNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const s2f = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
        const f2s = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };
        const intervalNames = ["1", "b2", "2", "b3", "3", "4", "b5", "5", "b6", "6", "b7", "7"];

        let selected = [];
        let bassNote = null;
        let useSharps = false;

        const unify = (text) => {
            if (!text) return "";
            const dict = useSharps ? f2s : s2f;
            return text.replace(/C#|D#|F#|G#|A#|Db|Eb|Gb|Ab|Bb/g, m => dict[m] || m);
        };

        const appUpdate = () => {
            const out = document.getElementById('chord-out');
            if (selected.length === 0) { out.innerText = "SELECT NOTES"; render(); return; }
            if (!bassNote || !selected.includes(bassNote)) bassNote = selected[0];

            let candidates = Tonal.Chord.detect(selected);
            const upper = selected.filter(n => n !== bassNote);
            if (upper.length >= 2) {
                Tonal.Chord.detect(upper).forEach(u => candidates.push(`${u.split('/')[0]}/${bassNote}`));
            }

            let finalCandidates = [...new Set(candidates)].filter(c => {
                if (c.includes('5/') && candidates.length > 1) return false;
                const parts = c.split('/');
                if (parts.length === 2) {
                    const r = Tonal.Chord.get(parts[0]).tonic;
                    if (r && Tonal.Note.get(r).chroma === Tonal.Note.get(bassNote).chroma) return false;
                }
                return true;
            });

            out.innerHTML = finalCandidates.map(c => {
                const root = Tonal.Chord.get(c.split('/')[0]).tonic;
                if (!root) return `<div class="chord-item"><div class="chord-name">${unify(c)}</div></div>`;
                
                const activeChromas = selected.map(n => Tonal.Note.get(n).chroma);
                const rootChroma = Tonal.Note.get(root).chroma;

                // 根音を0とした12音のバーを生成
                let barHtml = '<div class="viz-bar">';
                for (let i = 0; i < 12; i++) {
                    const currentChroma = (rootChroma + i) % 12;
                    const isActive = activeChromas.includes(currentChroma);
                    const isRoot = i === 0;
                    const className = `viz-cell ${isActive ? 'active' : ''} ${isRoot ? 'root' : ''}`;
                    barHtml += `<div class="${className}">${intervalNames[i]}</div>`;
                }
                barHtml += '</div>';

                return `<div class="chord-item">
                            <div class="chord-name">${unify(c)}</div>
                            ${barHtml}
                        </div>`;
            }).join('');
            render();
        };

        const render = () => {
            const pad = document.getElementById('pad');
            pad.innerHTML = "";
            rawNotes.forEach(n => {
                const btn = document.createElement('button');
                const isSelected = selected.includes(n);
                const isBass = isSelected && bassNote === n;
                btn.className = (isSelected ? 'selected' : '') + (isBass ? ' bass' : '');
                btn.innerText = unify(n);
                btn.onclick = () => {
                    if (selected.includes(n)) {
                        selected = selected.filter(x => x !== n);
                    } else {
                        selected.push(n);
                        if (selected.length === 1) bassNote = n;
                        if (['C#','D#','F#','G#','A#'].includes(n)) useSharps = true;
                        if (s2f[n]) useSharps = false;
                    }
                    appUpdate();
                };
                pad.appendChild(btn);
            });
        };

        document.getElementById('display').onclick = () => {
            if (selected.length > 1) {
                const idx = selected.indexOf(bassNote);
                bassNote = selected[(idx + 1) % selected.length];
                appUpdate();
            }
        };
        render();
    </script>
</body>
</html>
