<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chord Lab - Musical Analysis</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: white; touch-action: none; -webkit-user-select: none; user-select: none; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        button { 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px 5px; border: none; border-radius: 5px; background: #333; color: white; 
            min-height: 75px; outline: none; transition: 0.1s; touch-action: none;
        }
        .note-name { font-size: 1.1rem; font-weight: bold; pointer-events: none; }
        .interval-label { font-size: 0.85rem; color: #aaa; margin-top: 4px; pointer-events: none; font-weight: 500; }
        
        sup { font-size: 0.7em; vertical-align: super; line-height: 0; }
        .chord-name sup { margin-left: 0.5px; }
        
        button.selected { background: #007bff; }
        button.bass { border: 3px solid #ff4757; box-sizing: border-box; }
        button.is-root { background: #ff4757; } 

        #display { background: #000; padding: 15px; border-radius: 10px; min-height: 180px; margin-bottom: 20px; border: 1px solid #444; position: relative; }
        .chord-list { max-height: 200px; overflow-y: auto; }
        .chord-item { 
            padding: 10px; margin-bottom: 8px; background: #222; border-radius: 5px; 
            cursor: pointer; border: 1px solid transparent;
        }
        .chord-item.active { border-color: #00d1b2; background: #2a2a2a; }
        .chord-name { font-size: 1.5rem; font-weight: bold; color: #00d1b2; }
        
        #clear-btn {
            position: absolute; top: 10px; right: 10px;
            padding: 8px 15px; background: #444; color: #ccc;
            border: none; border-radius: 5px; font-size: 0.8rem; cursor: pointer;
            z-index: 10;
        }
        .label { font-size: 0.75rem; color: #888; margin-bottom: 6px; }
    </style>
</head>
<body onpointerdown="initAudio()">
    <div id="display">
        <button id="clear-btn" onclick="clearAll()">CLEAR</button>
        <div class="label">INTERPRETATIONS:</div>
        <div id="chord-out" class="chord-list">SELECT NOTES</div>
    </div>
    <div class="grid" id="pad"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <script>
        const baseChromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const s2f = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
        const f2s = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };
        const intervalNames = ["R", "m2", "M2", "m3", "M3", "P4", "-5", "P5", "+5", "M6", "m7", "M7"];

        let selected = [];
        let bassNote = null;
        let activeAnalysisRoot = null; 
        let useSharps = false;
        let pressTimer = null;
        let isLongPress = false;

        // Audio Context
        let audioCtx = null;
        const initAudio = () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };

        const getRawNotes = () => {
            const params = new URLSearchParams(window.location.search);
            let startNote = params.get('start') || 'C';
            if (f2s[startNote]) startNote = f2s[startNote];
            const startIndex = baseChromatic.indexOf(startNote.toUpperCase());
            if (startIndex === -1) return [...baseChromatic];
            return [...baseChromatic.slice(startIndex), ...baseChromatic.slice(0, startIndex)];
        };

        const rawNotes = getRawNotes();
        const params = new URLSearchParams(window.location.search);
        if (params.get('start')?.includes('b') || params.get('start') === 'F') {
            useSharps = false;
        } else if (params.get('start')?.includes('#')) {
            useSharps = true;
        }

        const unifySimple = (text) => {
            if (!text) return "";
            const dict = useSharps ? f2s : s2f;
            return text.replace(/C#|D#|F#|G#|A#|Db|Eb|Gb|Ab|Bb/g, m => dict[m] || m);
        };

        const unifyChordName = (text) => {
            let name = unifySimple(text);
            return name.replace(/([0-9]|#|b|\(|\))+/g, (match) => `<sup>${match}</sup>`);
        };
 

        // 現在鳴っている音源（オシレーター）を保持する配列

        let activeOscillators = [];

        const playChord = (rootName) => {
            if (!audioCtx) return;

            activeOscillators.forEach(osc => {
                try { osc.stop(); } catch (e) {}
            });
            activeOscillators = [];

            const rootFreq = Tonal.Note.freq(rootName + "3");
            const rootChroma = Tonal.Note.get(rootName).chroma;
            const duration = 5.0;

            selected.forEach(noteName => {
                const noteChroma = Tonal.Note.get(noteName).chroma;
                const semitones = (noteChroma - rootChroma + 12) % 12;

                let targetFreq;
                let volume = 0.08;

                if (semitones === 4) { // M3
                    targetFreq = rootFreq * 1.25;
                } else if (semitones === 3) { // m3
                    targetFreq = rootFreq * 1.2;
                } else {
                    const interval = Tonal.Interval.fromSemitones(semitones);
                    targetFreq = Tonal.Note.freq(Tonal.Note.transpose(rootName + "3", interval));
                }

                if (semitones === 0 || semitones === 7) {
                    volume = 0.15;
                }

                // ベース音の判定ロジックを更新
                if (noteName === bassNote) {
                    // 「ベース音名」が「根音名」より高い位置にある場合のみ、オクターブ下げる
                    // 例：根音がCでベースがE(4半音上)なら、Eをオクターブ下げる
                    if (semitones > 0) {
                        targetFreq = targetFreq * 0.5;
                    }
                    volume = 0.15; 
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = targetFreq;
                
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
                activeOscillators.push(osc);
            });
        };


        const clearAll = () => {
            selected = []; bassNote = null; activeAnalysisRoot = null;
            appUpdate();
        };

        const appUpdate = () => {
            const out = document.getElementById('chord-out');
            if (selected.length === 0) {
                out.innerText = "SELECT NOTES";
                activeAnalysisRoot = null; render(); return;
            }

            if (!bassNote || !selected.includes(bassNote)) {
                bassNote = selected[0] || null;
            }

            if (activeAnalysisRoot && !selected.includes(activeAnalysisRoot)) {
                activeAnalysisRoot = null;
            }

            let rawCandidates = Tonal.Chord.detect(selected);
            const upper = selected.filter(n => n !== bassNote);
            if (upper.length >= 2) {
                Tonal.Chord.detect(upper).forEach(u => rawCandidates.push(u));
            }

            let finalCandidates = [...new Set(rawCandidates)].map(c => {
                const main = c.split('/')[0];
                const root = Tonal.Chord.get(main).tonic;
                if (root && Tonal.Note.get(root).chroma === Tonal.Note.get(bassNote).chroma) {
                    return main;
                } else {
                    return `${main}/${bassNote}`;
                }
            });

            if (finalCandidates.length > 1) {
                finalCandidates = finalCandidates.filter(c => !c.includes('5/'));
            }

            if (finalCandidates.length > 0 && !activeAnalysisRoot) {
                activeAnalysisRoot = Tonal.Chord.get(finalCandidates[0].split('/')[0]).tonic;
            }

            out.innerHTML = finalCandidates.map(c => {
                const root = Tonal.Chord.get(c.split('/')[0]).tonic;
                const isActive = root === activeAnalysisRoot;
                return `
                    <div class="chord-item ${isActive ? 'active' : ''}" onclick="setAnalysisRoot('${root}'); playChord('${root}')">
                        <div class="chord-name">${unifyChordName(c)}</div>
                    </div>`;
            }).join('');

            render();
        };

        window.setAnalysisRoot = (root) => {
            activeAnalysisRoot = root;
            appUpdate();
        };

        const render = () => {
            const pad = document.getElementById('pad');
            pad.innerHTML = "";
            rawNotes.forEach(n => {
                const btn = document.createElement('button');
                const isSelected = selected.includes(n);
                const isBass = isSelected && bassNote === n;
                const isRoot = n === activeAnalysisRoot;

                btn.className = (isSelected ? 'selected' : '') + (isBass ? ' bass' : '') + (isRoot ? ' is-root' : '');
                
                let intervalLabel = "";
                if (activeAnalysisRoot) {
                    let d = (baseChromatic.indexOf(n) - baseChromatic.indexOf(activeAnalysisRoot) + 12) % 12;
                    intervalLabel = intervalNames[d];
                }

                btn.innerHTML = `
                    <span class="note-name">${unifySimple(n)}</span>
                    <span class="interval-label">${intervalLabel}</span>
                `;

                btn.onpointerdown = (e) => {
                    isLongPress = false;
                    pressTimer = setTimeout(() => {
                        isLongPress = true;
                        if (!selected.includes(n)) selected.push(n);
                        bassNote = n;
                        if (['C#','D#','F#','G#','A#'].includes(n)) useSharps = true;
                        if (s2f[n]) useSharps = false;
                        appUpdate();
                    }, 500);
                };

                btn.onpointerup = (e) => {
                    if (pressTimer) {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                        if (!isLongPress) {
                            if (selected.includes(n)) {
                                selected = selected.filter(x => x !== n);
                                if (n === bassNote) bassNote = null;
                                if (n === activeAnalysisRoot) activeAnalysisRoot = null;
                            } else {
                                selected.push(n);
                                if (['C#','D#','F#','G#','A#'].includes(n)) useSharps = true;
                                if (s2f[n]) useSharps = false;
                            }
                            appUpdate();
                        }
                    }
                };

                btn.onpointercancel = btn.onpointerleave = (e) => {
                    if (pressTimer) {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                    }
                };

                pad.appendChild(btn);
            });
        };

        appUpdate();
    </script>
</body>
</html>
