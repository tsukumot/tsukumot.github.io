<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chord Lab - True Interpretation</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: white; touch-action: manipulation; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        button { padding: 15px 5px; border: none; border-radius: 5px; background: #333; color: white; font-size: 1.1rem; min-height: 60px; outline: none; }
        button.selected { background: #007bff; font-weight: bold; }
        button.bass { border: 3px solid #ff4757; box-sizing: border-box; }
        #display { background: #000; padding: 15px; border-radius: 10px; min-height: 200px; margin-bottom: 20px; border: 1px solid #444; }
        .chord-list { max-height: 240px; overflow-y: auto; margin-bottom: 10px; border-bottom: 1px solid #333; }
        .chord-item { display: block; font-size: 1.25rem; font-weight: bold; color: #00d1b2; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .interval-info { font-size: 1.1rem; color: #ffa502; font-weight: bold; }
        .label { font-size: 0.75rem; color: #888; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div id="display">
        <div class="label">INTERPRETATIONS (WITH TENSIONS):</div>
        <div id="chord-out" class="chord-list">SELECT NOTES</div>
        <div class="label">INTERVALS FROM BASS:</div>
        <div id="interval-out" class="interval-info"></div>
    </div>
    <div class="grid" id="pad"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <script>
        const rawNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const s2f = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
        const f2s = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };
        const semitoneToInterval = ["1", "b2", "2", "b3", "3", "4", "b5", "5", "b6", "6", "b7", "7"];

        let selected = [];
        let bassNote = null;
        let useSharps = false;

        const unify = (text) => {
            if (!text) return "";
            const dict = useSharps ? f2s : s2f;
            return text.replace(/C#|D#|F#|G#|A#|Db|Eb|Gb|Ab|Bb/g, m => dict[m] || m);
        };

        const analyzeWithTensions = (root, notes, currentBass) => {
            // Tonal.jsのdetectをベースに、不足している音をテンションとして補完する
            const results = Tonal.Chord.detect(notes, { assumeRoot: root });
            
            if (results.length > 0) return results[0]; // 既製品があればそれを返す

            // ライブラリで見つからない場合、サブセットから基本和音を探し、残りをadd/tension表記にする
            for (let i = 0; i < notes.length; i++) {
                const subset = notes.filter((_, idx) => idx !== i);
                if (subset.length < 3) continue;
                
                const baseChords = Tonal.Chord.detect(subset, { assumeRoot: root });
                if (baseChords.length > 0) {
                    const extraNote = notes[i];
                    let diff = rawNotes.indexOf(extraNote) - rawNotes.indexOf(root);
                    if (diff < 0) diff += 12;
                    const tension = semitoneToInterval[diff].replace("b2", "♭9").replace("2", "9").replace("b5", "♭5").replace("b6", "♭13");
                    return `${baseChords[0]}add${tension}`;
                }
            }
            return null;
        };

        const appUpdate = () => {
            const out = document.getElementById('chord-out');
            const ivOut = document.getElementById('interval-out');
            
            if (selected.length === 0) {
                out.innerText = "---"; ivOut.innerText = "---";
                render(); return;
            }

            if (!bassNote || !selected.includes(bassNote)) bassNote = selected[0];
            const upper = selected.filter(n => n !== bassNote);
            let candidates = [];

            if (typeof Tonal !== 'undefined') {
                // 1. 全音を対象に各音をルートとして解析（add表記対応）
                selected.forEach(r => {
                    const res = analyzeWithTensions(r, selected, bassNote);
                    if (res) {
                        if (Tonal.Note.get(r).chroma === Tonal.Note.get(bassNote).chroma) candidates.push(res);
                        else candidates.push(`${res}/${bassNote}`);
                    }
                });

                // 2. 上部構造のみでの解析
                if (upper.length >= 3) {
                    upper.forEach(r => {
                        const res = analyzeWithTensions(r, upper, bassNote);
                        if (res) candidates.push(`${res}/${bassNote}`);
                    });
                }
            }

            const uniqueCandidates = [...new Set(candidates)];
            if (uniqueCandidates.length > 0) {
                out.innerHTML = uniqueCandidates.map(c => `<div class="chord-item">${unify(c)}</div>`).join('');
            } else {
                out.innerHTML = `<div class="chord-item">No Interpretation found</div>`;
            }

            ivOut.innerText = upper.map(n => {
                let d = rawNotes.indexOf(n) - rawNotes.indexOf(bassNote);
                if (d < 0) d += 12;
                return `${unify(n)}:${unify(semitoneToInterval[d])}`;
            }).join(' | ');

            render();
        };

        const render = () => {
            const pad = document.getElementById('pad');
            pad.innerHTML = "";
            rawNotes.forEach(n => {
                const btn = document.createElement('button');
                const isSelected = selected.includes(n);
                const isBass = isSelected && bassNote === n;
                btn.className = (isSelected ? 'selected' : '') + (isBass ? ' bass' : '');
                btn.innerText = unify(n);
                btn.onclick = () => {
                    if (selected.includes(n)) {
                        selected = selected.filter(x => x !== n);
                    } else {
                        selected.push(n);
                        if (selected.length === 1) bassNote = n;
                        if (['C#','D#','F#','G#','A#'].includes(n)) useSharps = true;
                        if (s2f[n]) useSharps = false;
                    }
                    appUpdate();
                };
                pad.appendChild(btn);
            });
        };

        document.getElementById('display').onclick = () => {
            if (selected.length > 1) {
                const idx = selected.indexOf(bassNote);
                bassNote = selected[(idx + 1) % selected.length];
                appUpdate();
            }
        };
        render();
    </script>
</body>
</html>
