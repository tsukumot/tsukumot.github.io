<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chord Lab - Index Logic</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: white; touch-action: manipulation; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        button { padding: 15px 5px; border: none; border-radius: 5px; background: #333; color: white; font-size: 1.1rem; min-height: 60px; outline: none; }
        button.selected { background: #007bff; font-weight: bold; }
        button.bass { border: 3px solid #ff4757; box-sizing: border-box; }
        #display { background: #000; padding: 20px; border-radius: 10px; text-align: center; min-height: 100px; margin-bottom: 20px; border: 1px solid #444; }
        .chord-main { font-size: 1.8rem; font-weight: bold; color: #00d1b2; margin: 10px 0; }
        .interval-info { font-size: 0.9rem; color: #ffa502; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="display">
        <div id="chord-out" class="chord-main">SELECT NOTES</div>
        <div id="interval-out" class="interval-info"></div>
    </div>
    <div class="grid" id="pad"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <script>
        const rawNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const s2f = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
        const f2s = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };
        const semitoneToInterval = ["1", "b2", "2", "b3", "3", "4", "b5", "5", "b6", "6", "b7", "7"];

        let selected = [];
        let bassIndex = 0;
        let useSharps = false;

        const unify = (text) => {
            if (!text) return "";
            return useSharps 
                ? text.replace(/Db|Eb|Gb|Ab|Bb/g, m => f2s[m] || m)
                : text.replace(/C#|D#|F#|G#|A#/g, m => s2f[m] || m);
        };

        const appUpdate = () => {
            const out = document.getElementById('chord-out');
            const ivOut = document.getElementById('interval-out');
            
            if (selected.length === 0) {
                out.innerText = "SELECT NOTES";
                ivOut.innerText = "";
                render();
                return;
            }

            const bass = selected[bassIndex % selected.length];
            const bassNoteInfo = Tonal.Note.get(bass);
            
            let finalName = "";
            if (typeof Tonal !== 'undefined') {
                const allDetected = Tonal.Chord.detect(selected);
                
                if (allDetected.length > 0) {
                    // Tonal.Chord.get を使って、解析された和音の「ルート音」を正確に取得する
                    const chordInfo = Tonal.Chord.get(allDetected[0]);
                    
                    // ルート音の半音数インデックスを比較 (文字列比較の揺れを回避)
                    const rootIdx = Tonal.Note.get(chordInfo.tonic).chroma;
                    const bassIdx = Tonal.Note.get(bass).chroma;

                    if (rootIdx === bassIdx) {
                        // ルートとベースが同じなら、スラッシュなしの名称を採用
                        finalName = chordInfo.name === "major" ? chordInfo.tonic : allDetected[0];
                    } else {
                        // ルートとベースが違うならオンコード
                        // ただし解析結果がすでにスラッシュを含んでいる場合は、アッパー構造として再定義
                        const upper = selected.filter(n => n !== bass);
                        const upperDetected = Tonal.Chord.detect(upper);
                        const upperName = (upperDetected.length > 0) ? upperDetected[0] : upper.join(',');
                        finalName = `${upperName} / ${bass}`;
                    }
                } else {
                    const upper = selected.filter(n => n !== bass);
                    const upperDetected = Tonal.Chord.detect(upper);
                    const upperName = (upperDetected.length > 0) ? upperDetected[0] : upper.join(',');
                    finalName = upper.length === 0 ? bass : `${upperName} / ${bass}`;
                }
            }

            out.innerText = unify(finalName);

            // 度数計算
            const others = selected.filter(n => n !== bass);
            ivOut.innerText = others.map(n => {
                let diff = rawNotes.indexOf(n) - rawNotes.indexOf(bass);
                if (diff < 0) diff += 12;
                return `${unify(n)}:${unify(semitoneToInterval[diff])}`;
            }).join(' | ');

            render();
        };

        const render = () => {
            const pad = document.getElementById('pad');
            pad.innerHTML = "";
            rawNotes.forEach(n => {
                const btn = document.createElement('button');
                const isSelected = selected.includes(n);
                const isBass = isSelected && selected[bassIndex % selected.length] === n;
                btn.className = (isSelected ? 'selected' : '') + (isBass ? ' bass' : '');
                btn.innerText = unify(n);
                btn.onclick = () => {
                    if (selected.includes(n)) {
                        selected = selected.filter(x => x !== n);
                    } else {
                        selected.push(n);
                        if (['C#','D#','F#','G#','A#'].includes(n)) useSharps = true;
                        if (s2f[n]) useSharps = false;
                    }
                    appUpdate();
                };
                pad.appendChild(btn);
            });
        };

        document.getElementById('display').onclick = () => {
            if (selected.length > 0) {
                bassIndex++;
                appUpdate();
            }
        };

        render();
    </script>
</body>
</html>
