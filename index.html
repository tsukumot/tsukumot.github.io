<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chord Lab - Priority Search</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: white; touch-action: manipulation; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        button { padding: 15px 5px; border: none; border-radius: 5px; background: #333; color: white; font-size: 1.1rem; min-height: 60px; outline: none; }
        button.selected { background: #007bff; font-weight: bold; }
        button.bass { border: 3px solid #ff4757; box-sizing: border-box; }
        #display { background: #000; padding: 15px; border-radius: 10px; min-height: 180px; margin-bottom: 20px; border: 1px solid #444; }
        .chord-list { max-height: 140px; overflow-y: auto; margin-bottom: 10px; border-bottom: 1px solid #333; }
        .chord-item { display: block; font-size: 1.3rem; font-weight: bold; color: #00d1b2; margin-bottom: 8px; }
        .chord-item.high-prob { color: #fffa65; } /* 確度が高いものに色付け */
        .interval-info { font-size: 1rem; color: #ffa502; font-weight: bold; }
        .label { font-size: 0.7rem; color: #888; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div id="display">
        <div class="label">SUGGESTED CHORDS (Ranked by Probability):</div>
        <div id="chord-out" class="chord-list">SELECT NOTES</div>
        <div class="label">INTERVALS FROM BASS:</div>
        <div id="interval-out" class="interval-info"></div>
    </div>
    <div class="grid" id="pad"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <script>
        const rawNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const s2f = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
        const f2s = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };
        const semitoneToInterval = ["1", "b2", "2", "b3", "3", "4", "b5", "5", "b6", "6", "b7", "7"];

        let selected = [];
        let bassNote = null;
        let useSharps = false;

        const unify = (text) => {
            if (!text) return "";
            const dict = useSharps ? f2s : s2f;
            return text.replace(/C#|D#|F#|G#|A#|Db|Eb|Gb|Ab|Bb/g, m => dict[m] || m);
        };

        const getScore = (chordName, bass) => {
            const info = Tonal.Chord.get(chordName.split(' / ')[0]);
            let score = 0;
            // 1. ベースがルートと一致なら高得点
            if (Tonal.Note.get(info.tonic).chroma === Tonal.Note.get(bass).chroma) score += 100;
            // 2. メジャー/マイナーなどの基本形は加点
            if (["major", "minor", ""].includes(info.type)) score += 50;
            // 3. 複雑な記号(omit, #, b)が多ければ減点
            score -= (chordName.length * 2);
            return score;
        };

        const appUpdate = () => {
            const out = document.getElementById('chord-out');
            const ivOut = document.getElementById('interval-out');
            if (selected.length === 0) {
                out.innerText = "---"; ivOut.innerText = "---";
                render(); return;
            }

            if (!bassNote || !selected.includes(bassNote)) bassNote = selected[0];
            const upper = selected.filter(n => n !== bassNote);
            let candidates = [];

            if (typeof Tonal !== 'undefined') {
                const allDet = Tonal.Chord.detect(selected);
                const upperDet = upper.length > 0 ? Tonal.Chord.detect(upper) : [];

                allDet.forEach(c => {
                    const info = Tonal.Chord.get(c);
                    if (Tonal.Note.get(info.tonic).chroma === Tonal.Note.get(bassNote).chroma) {
                        candidates.push({name: info.symbol, score: getScore(info.symbol, bassNote)});
                    } else {
                        const name = `${info.symbol} / ${bassNote}`;
                        candidates.push({name: name, score: getScore(name, bassNote)});
                    }
                });

                upperDet.forEach(u => {
                    const name = `${u} / ${bassNote}`;
                    candidates.push({name: name, score: getScore(name, bassNote)});
                });
            }

            // スコア順にソートして描画
            candidates.sort((a, b) => b.score - a.score);
            const uniqueNames = [...new Set(candidates.map(c => c.name))];
            
            out.innerHTML = uniqueNames.map((name, i) => {
                const cssClass = i === 0 ? "chord-item high-prob" : "chord-item";
                return `<div class="${cssClass}">${unify(name)}</div>`;
            }).join('');

            ivOut.innerText = upper.map(n => {
                let diff = rawNotes.indexOf(n) - rawNotes.indexOf(bassNote);
                if (diff < 0) diff += 12;
                return `${unify(n)}:${unify(semitoneToInterval[diff])}`;
            }).join(' | ');

            render();
        };

        const render = () => {
            const pad = document.getElementById('pad');
            pad.innerHTML = "";
            rawNotes.forEach(n => {
                const btn = document.createElement('button');
                const isSelected = selected.includes(n);
                const isBass = isSelected && bassNote === n;
                btn.className = (isSelected ? 'selected' : '') + (isBass ? ' bass' : '');
                btn.innerText = unify(n);
                btn.onclick = () => {
                    if (selected.includes(n)) {
                        selected = selected.filter(x => x !== n);
                        if (bassNote === n) bassNote = null;
                    } else {
                        selected.push(n);
                        if (!bassNote) bassNote = n;
                        if (['C#','D#','F#','G#','A#'].includes(n)) useSharps = true;
                        if (s2f[n]) useSharps = false;
                    }
                    appUpdate();
                };
                pad.appendChild(btn);
            });
        };

        document.getElementById('display').onclick = () => {
            if (selected.length > 0) {
                const idx = selected.indexOf(bassNote);
                bassNote = selected[(idx + 1) % selected.length];
                appUpdate();
            }
        };
        render();
    </script>
</body>
</html>
