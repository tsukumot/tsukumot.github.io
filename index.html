<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chord Lab - Deduplicated</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: white; touch-action: manipulation; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        button { padding: 15px 5px; border: none; border-radius: 5px; background: #333; color: white; font-size: 1.1rem; min-height: 60px; outline: none; }
        button.selected { background: #007bff; font-weight: bold; }
        button.bass { border: 3px solid #ff4757; box-sizing: border-box; }
        #display { background: #000; padding: 15px; border-radius: 10px; min-height: 150px; margin-bottom: 20px; border: 1px solid #444; }
        .chord-list { max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
        .chord-item { display: block; font-size: 1.2rem; font-weight: bold; color: #00d1b2; margin-bottom: 5px; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .interval-info { font-size: 0.9rem; color: #ffa502; border-top: 1px solid #333; padding-top: 10px; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="display">
        <div id="chord-out" class="chord-list">SELECT NOTES</div>
        <div id="interval-out" class="interval-info"></div>
    </div>
    <div class="grid" id="pad"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <script>
        const rawNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const s2f = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
        const f2s = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };
        const semitoneToInterval = ["1", "b2", "2", "b3", "3", "4", "b5", "5", "b6", "6", "b7", "7"];

        let selected = [];
        let bassNote = null;
        let useSharps = false;

        const unify = (text) => {
            if (!text) return "";
            const dict = useSharps ? f2s : s2f;
            return text.replace(/C#|D#|F#|G#|A#|Db|Eb|Gb|Ab|Bb/g, m => dict[m] || m);
        };

        const appUpdate = () => {
            const out = document.getElementById('chord-out');
            const ivOut = document.getElementById('interval-out');
            if (selected.length === 0) {
                out.innerText = "SELECT NOTES"; ivOut.innerText = "";
                render(); return;
            }

            if (!bassNote || !selected.includes(bassNote)) {
                bassNote = selected[0];
            }

            const upper = selected.filter(n => n !== bassNote);
            let candidates = [];

            if (typeof Tonal !== 'undefined') {
                // 1. 全体解析
                const allDet = Tonal.Chord.detect(selected);
                let rootMatchFound = false;

                allDet.forEach(c => {
                    const info = Tonal.Chord.get(c);
                    const isRootBass = Tonal.Note.get(info.tonic).chroma === Tonal.Note.get(bassNote).chroma;
                    
                    if (isRootBass) {
                        // メジャーコード等の基本形
                        candidates.push(info.name === "major" ? info.tonic : c);
                        rootMatchFound = true;
                    } else {
                        // 転回形
                        candidates.push(`${c.split('/')[0]} / ${bassNote}`);
                    }
                });

                // 2. 上部構造解析 (全体解析でルート一致が見つからない場合、または補足として)
                if (upper.length > 0) {
                    const upperDet = Tonal.Chord.detect(upper);
                    upperDet.forEach(u => {
                        const slashName = `${u} / ${bassNote}`;
                        // 全体解析の結果と本質的に同じものは追加しない
                        if (!candidates.some(existing => existing.split(' ')[0] === u)) {
                            candidates.push(slashName);
                        }
                    });
                }
            }

            const uniqueCandidates = [...new Set(candidates)];
            // リストを整理: ルートがベースと一致するものを上に、シンプルな名称を優先
            uniqueCandidates.sort((a, b) => a.length - b.length);

            if (uniqueCandidates.length > 0) {
                out.innerHTML = uniqueCandidates.map(c => `<div class="chord-item">${unify(c)}</div>`).join('');
            } else {
                out.innerHTML = `<div class="chord-item">${unify(upper.length === 0 ? bassNote : upper.join(',') + ' / ' + bassNote)}</div>`;
            }

            // 度数計算
            ivOut.innerText = upper.map(n => {
                let diff = rawNotes.indexOf(n) - rawNotes.indexOf(bassNote);
                if (diff < 0) diff += 12;
                return `${unify(n)}:${unify(semitoneToInterval[diff])}`;
            }).join(' | ');

            render();
        };

        const render = () => {
            const pad = document.getElementById('pad');
            pad.innerHTML = "";
            rawNotes.forEach(n => {
                const btn = document.createElement('button');
                const isSelected = selected.includes(n);
                const isBass = isSelected && bassNote === n;
                btn.className = (isSelected ? 'selected' : '') + (isBass ? ' bass' : '');
                btn.innerText = unify(n);
                btn.onclick = () => {
                    if (selected.includes(n)) {
                        selected = selected.filter(x => x !== n);
                        if (bassNote === n) bassNote = null;
                    } else {
                        selected.push(n);
                        if (!bassNote) bassNote = n;
                        if (['C#','D#','F#','G#','A#'].includes(n)) useSharps = true;
                        if (s2f[n]) useSharps = false;
                    }
                    appUpdate();
                };
                pad.appendChild(btn);
            });
        };

        document.getElementById('display').onclick = () => {
            if (selected.length > 0) {
                const idx = selected.indexOf(bassNote);
                bassNote = selected[(idx + 1) % selected.length];
                appUpdate();
            }
        };

        render();
    </script>
</body>
</html>
