<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chord Lab - Full List</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: white; touch-action: manipulation; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        button { padding: 15px 5px; border: none; border-radius: 5px; background: #333; color: white; font-size: 1.1rem; min-height: 60px; outline: none; }
        button.selected { background: #007bff; font-weight: bold; }
        button.bass { border: 3px solid #ff4757; box-sizing: border-box; }
        #display { background: #000; padding: 15px; border-radius: 10px; min-height: 120px; margin-bottom: 20px; border: 1px solid #444; overflow-y: auto; }
        .chord-list { font-size: 1.2rem; font-weight: bold; color: #00d1b2; margin-bottom: 8px; line-height: 1.4; }
        .chord-item { display: inline-block; margin-right: 15px; }
        .interval-info { font-size: 0.9rem; color: #ffa502; border-top: 1px solid #333; padding-top: 8px; }
    </style>
</head>
<body>
    <div id="display">
        <div id="chord-out" class="chord-list">SELECT NOTES</div>
        <div id="interval-out" class="interval-info"></div>
    </div>
    <div class="grid" id="pad"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <script>
        const rawNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const s2f = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
        const f2s = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };
        const semitoneToInterval = ["1", "b2", "2", "b3", "3", "4", "b5", "5", "b6", "6", "b7", "7"];

        let selected = [];
        let bassIndex = 0;
        let useSharps = false;

        const unify = (text) => {
            if (!text) return "";
            const dict = useSharps ? f2s : s2f;
            return text.replace(/C#|D#|F#|G#|A#|Db|Eb|Gb|Ab|Bb/g, m => dict[m] || m);
        };

        const appUpdate = () => {
            const out = document.getElementById('chord-out');
            const ivOut = document.getElementById('interval-out');
            if (selected.length === 0) {
                out.innerText = "SELECT NOTES"; ivOut.innerText = "";
                render(); return;
            }

            const bass = selected[bassIndex % selected.length];
            const upper = selected.filter(n => n !== bass);
            
            let candidates = [];
            if (typeof Tonal !== 'undefined') {
                // 1. ベースを含む全構成音での解析候補
                const allDet = Tonal.Chord.detect(selected);
                
                // 2. 上部構造のみでの解析候補
                const upperDet = upper.length > 0 ? Tonal.Chord.detect(upper) : [];

                // 候補の統合
                candidates = [...allDet];
                upperDet.forEach(u => {
                    const slashName = `${u} / ${bass}`;
                    if (!candidates.includes(slashName)) candidates.push(slashName);
                });
            }

            // 結果の描画
            if (candidates.length > 0) {
                out.innerHTML = candidates.map(c => `<span class="chord-item">${unify(c)}</span>`).join('');
            } else {
                out.innerText = unify(upper.length === 0 ? bass : `${upper.join(',')} / ${bass}`);
            }

            // 度数計算
            ivOut.innerText = upper.map(n => {
                let diff = rawNotes.indexOf(n) - rawNotes.indexOf(bass);
                if (diff < 0) diff += 12;
                return `${unify(n)}:${unify(semitoneToInterval[diff])}`;
            }).join(' | ');

            render();
        };

        const render = () => {
            const pad = document.getElementById('pad');
            pad.innerHTML = "";
            rawNotes.forEach(n => {
                const btn = document.createElement('button');
                const isSelected = selected.includes(n);
                const isBass = isSelected && selected[bassIndex % selected.length] === n;
                btn.className = (isSelected ? 'selected' : '') + (isBass ? ' bass' : '');
                btn.innerText = unify(n);
                btn.onclick = () => {
                    if (selected.includes(n)) {
                        selected = selected.filter(x => x !== n);
                    } else {
                        selected.push(n);
                        if (['C#','D#','F#','G#','A#'].includes(n)) useSharps = true;
                        if (s2f[n]) useSharps = false;
                    }
                    appUpdate();
                };
                pad.appendChild(btn);
            });
        };

        document.getElementById('display').onclick = () => {
            if (selected.length > 0) {
                bassIndex++;
                appUpdate();
            }
        };

        render();
    </script>
</body>
</html>
