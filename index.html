<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chord Lab - Musical Analysis</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: white; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        button { 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px 5px; border: none; border-radius: 5px; background: #333; color: white; 
            min-height: 75px; outline: none; transition: 0.1s;
        }
        .note-name { font-size: 1.1rem; font-weight: bold; pointer-events: none; }
        .interval-label { font-size: 0.9rem; color: #aaa; margin-top: 4px; pointer-events: none; }
        
        .chord-name sup { font-size: 0.7em; vertical-align: super; line-height: 0; margin-left: 0.5px; }
        
        button.selected { background: #007bff; }
        button.bass { border: 3px solid #ff4757; box-sizing: border-box; }
        button.is-root { background: #ff4757; } 

        #display { background: #000; padding: 15px; border-radius: 10px; min-height: 180px; margin-bottom: 20px; border: 1px solid #444; position: relative; }
        .chord-list { max-height: 200px; overflow-y: auto; }
        .chord-item { 
            padding: 10px; margin-bottom: 8px; background: #222; border-radius: 5px; 
            cursor: pointer; border: 1px solid transparent;
        }
        .chord-item.active { border-color: #00d1b2; background: #2a2a2a; }
        .chord-name { font-size: 1.5rem; font-weight: bold; color: #00d1b2; }
        
        #clear-btn {
            position: absolute; top: 10px; right: 10px;
            padding: 8px 15px; background: #444; color: #ccc;
            border: none; border-radius: 5px; font-size: 0.8rem; cursor: pointer;
            z-index: 10;
        }
        .label { font-size: 0.75rem; color: #888; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div id="display">
        <button id="clear-btn" onclick="clearAll()">CLEAR</button>
        <div class="label">INTERPRETATIONS:</div>
        <div id="chord-out" class="chord-list">SELECT NOTES</div>
    </div>
    <div class="grid" id="pad"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>

    <script>
        const rawNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const s2f = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
        const f2s = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };
        const intervalNames = ["1", "b2", "2", "b3", "3", "4", "b5", "5", "b6", "6", "b7", "7"];

        let selected = [];
        let bassNote = null;
        let activeAnalysisRoot = null; 
        let useSharps = false;
        let pressTimer;

        const unifySimple = (text) => {
            if (!text) return "";
            const dict = useSharps ? f2s : s2f;
            return text.replace(/C#|D#|F#|G#|A#|Db|Eb|Gb|Ab|Bb/g, m => dict[m] || m);
        };

        const unifyChordName = (text) => {
            let name = unifySimple(text);
            const parts = name.split('/');
            parts[0] = parts[0].replace(/([0-9]|#|b|\(|\))+/g, (match) => `<sup>${match}</sup>`);
            return parts.join('/');
        };

        const clearAll = () => {
            selected = []; bassNote = null; activeAnalysisRoot = null; useSharps = false;
            appUpdate();
        };

        const appUpdate = () => {
            const out = document.getElementById('chord-out');
            if (selected.length === 0) {
                out.innerText = "SELECT NOTES";
                activeAnalysisRoot = null; render(); return;
            }

            // ベース音が未設定、もしくは選択解除された場合の自動フォロー
            if (!bassNote || !selected.includes(bassNote)) {
                bassNote = selected[0];
            }

            let candidates = Tonal.Chord.detect(selected);
            const upper = selected.filter(n => n !== bassNote);
            if (upper.length >= 2) {
                Tonal.Chord.detect(upper).forEach(u => candidates.push(`${u.split('/')[0]}/${bassNote}`));
            }

            let finalCandidates = [...new Set(candidates)].filter(c => {
                if (c.includes('5/') && candidates.length > 1) return false;
                const parts = c.split('/');
                if (parts.length === 2) {
                    const r = Tonal.Chord.get(parts[0]).tonic;
                    if (r && Tonal.Note.get(r).chroma === Tonal.Note.get(bassNote).chroma) return false;
                }
                return true;
            });

            if (finalCandidates.length > 0) {
                const firstRoot = Tonal.Chord.get(finalCandidates[0].split('/')[0]).tonic;
                if (!activeAnalysisRoot || !selected.includes(activeAnalysisRoot)) {
                    activeAnalysisRoot = firstRoot;
                }
            }

            out.innerHTML = finalCandidates.map(c => {
                const root = Tonal.Chord.get(c.split('/')[0]).tonic;
                const isActive = root === activeAnalysisRoot;
                return `
                    <div class="chord-item ${isActive ? 'active' : ''}" onclick="setAnalysisRoot('${root}')">
                        <div class="chord-name">${unifyChordName(c)}</div>
                    </div>`;
            }).join('');

            render();
        };

        window.setAnalysisRoot = (root) => {
            activeAnalysisRoot = root;
            appUpdate();
        };

        const render = () => {
            const pad = document.getElementById('pad');
            pad.innerHTML = "";
            rawNotes.forEach(n => {
                const btn = document.createElement('button');
                const isSelected = selected.includes(n);
                const isBass = isSelected && bassNote === n;
                const isRoot = n === activeAnalysisRoot;

                btn.className = (isSelected ? 'selected' : '') + (isBass ? ' bass' : '') + (isRoot ? ' is-root' : '');
                
                let intervalLabel = "";
                if (activeAnalysisRoot) {
                    let d = (rawNotes.indexOf(n) - rawNotes.indexOf(activeAnalysisRoot) + 12) % 12;
                    intervalLabel = intervalNames[d];
                }

                btn.innerHTML = `
                    <span class="note-name">${unifySimple(n)}</span>
                    <span class="interval-label">${intervalLabel}</span>
                `;

                // 長押しとタップの判定
                const start = (e) => {
                    e.preventDefault();
                    pressTimer = setTimeout(() => {
                        // 長押し時の挙動: ベース音に指定
                        if (!selected.includes(n)) selected.push(n);
                        bassNote = n;
                        if (['C#','D#','F#','G#','A#'].includes(n)) useSharps = true;
                        if (s2f[n]) useSharps = false;
                        appUpdate();
                        pressTimer = null;
                    }, 500);
                };

                const end = (e) => {
                    if (pressTimer) {
                        clearTimeout(pressTimer);
                        // 短押し（通常のタップ）の挙動: 選択/解除
                        if (selected.includes(n)) {
                            selected = selected.filter(x => x !== n);
                        } else {
                            selected.push(n);
                            if (selected.length === 1) bassNote = n;
                            if (['C#','D#','F#','G#','A#'].includes(n)) useSharps = true;
                            if (s2f[n]) useSharps = false;
                        }
                        appUpdate();
                    }
                };

                btn.onmousedown = start;
                btn.onmouseup = end;
                btn.ontouchstart = start;
                btn.ontouchend = end;

                pad.appendChild(btn);
            });
        };

        render();
    </script>
</body>
</html>
